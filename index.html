<!doctype html>
<html lang="uk">
<!--
  ============================================================================================
  «Погода на дачі» — сторінка мініапліковації Telegram (GitHub Pages)
  ВЕРСІЯ СТОРІНКИ: 1.3.0 (27.10.2026) — показується внизу сторінки («Версія сторінки …»)
  ============================================================================================
  Що змінилось:
    1.3.0  Графік напруги розфарбовано за зонами: 🟡 нижче 207 В, 🟢 норма 207–253 В, 🔴 вище 253 В; пунктирні межі зон.
    1.2.0  Опади — одразу після температури; графік «Напруга» — останнім і РІЗНОКОЛЬОРОВИЙ (🟡 нижче 207 В, 🟢 норма, 🔴 вище 253 В) (з'являється, лише якщо
           в Apps Script увімкнено PUBLIC_VOLT=1); у підвалі видно версію сторінки.
    1.1.0  (скасовано) знімок раз на хвилину.
    1.0.x  Перший випуск: поточна погода, кнопка «Надіслати мені погоду», графіки 24 год / 7 діб.

  КАРТА СТОРІНКИ (де що шукати нижче в коді):
    HTML      <main> — заголовок, блок «зараз» (#now), кнопка (#send), перемикач 24 год/7 діб (#seg),
              контейнер графіків (#charts), підвал (#foot) з версією.
    СКРИПТ    ЗАВАНТАЖЕННЯ ДАНИХ:  api(), load()            — запит історії в Apps Script
              ВИВЕДЕННЯ:           render()                 — блок «зараз» + ПОРЯДОК ГРАФІКІВ (див. нижче)
                                   card()                   — обгортка «картка з заголовком»
              ДАНІ ДЛЯ ГРАФІКІВ:   rainBuckets()            — опади по годинах із приростів лічильника
              МАЛЮВАННЯ ГРАФІКІВ:  niceTicks(), timeAxis()  — підписи осей
                                   lineChart()              — лінійний графік (температура, тиск, вітер, напруга)
                                   barChart()               — стовпчики (опади)
                                   showTip(), attachTip()   — підказка при дотику
              КНОПКА:              updateButton(), sendRequest() — «Надіслати мені погоду»
    ПОРЯДОК ГРАФІКІВ задається у render(): Температура → Опади → Тиск → Вітер → Напруга мережі.
    Щоб змінити порядок — переставте відповідні рядки box.appendChild(card(...)) у render().
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Погода на дачі</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f4f8);
    --text: var(--tg-theme-text-color, #14212e);
    --hint: var(--tg-theme-hint-color, #6b7c8c);
    --accent: var(--tg-theme-button-color, #2b7fd1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --warn: #d9822b;
    --ok: #2f9e5a;
    --bad: #d64545;
    --c-temp: #e0632f;
    --c-press: #7a5fd0;
    --c-wind: #2b9bb0;
    --c-gust: #9bb7c4;
    --c-rain: #3b86c9;
    --c-volt: #d4a017;
    --grid: rgba(120, 140, 160, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: var(--tg-theme-bg-color, #17212b); --card: var(--tg-theme-secondary-bg-color, #1f2c3a); --text: var(--tg-theme-text-color, #e8eef4); --hint: var(--tg-theme-hint-color, #8fa1b3); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 4px 0 2px; }
  .sub { color: var(--hint); font-size: 14px; margin-bottom: 14px; }
  .ver { opacity: .8; }
  .sub.stale { color: var(--warn); }
  .now { background: var(--card); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 10px 12px; }
  .now .big { grid-row: span 2; display: flex; flex-direction: column; justify-content: center; }
  .now .big .v { font-size: 40px; font-weight: 700; line-height: 1; }
  .now .big .l { color: var(--hint); font-size: 13px; margin-top: 4px; }
  .m .v { font-size: 18px; font-weight: 600; }
  .m .l { color: var(--hint); font-size: 12px; }
  .raining { margin-top: 8px; font-weight: 600; color: var(--c-rain); }
  button.cta { width: 100%; margin: 14px 0 6px; padding: 14px 16px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.cta:disabled { opacity: .55; cursor: default; }
  .note { color: var(--hint); font-size: 13px; min-height: 18px; }
  .note.ok { color: var(--ok); } .note.err { color: var(--bad); }
  .seg { display: inline-flex; background: var(--card); border-radius: 12px; padding: 3px; margin: 18px 0 10px; }
  .seg button { border: 0; background: transparent; color: var(--text); padding: 7px 16px; border-radius: 9px; font-size: 14px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: var(--accent-text); }
  .card { background: var(--card); border-radius: 16px; padding: 12px 12px 8px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--hint); font-weight: 400; font-size: 12px; }
  svg.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .axis text { fill: var(--hint); font-size: 10px; }
  .empty { color: var(--hint); text-align: center; padding: 22px 0; font-size: 14px; }
  footer { color: var(--hint); font-size: 12px; margin-top: 16px; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 8px; opacity: 0; transition: opacity .1s; z-index: 5; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Погода на дачі</h1>
  <div class="sub" id="updated">Завантаження…</div>

  <section class="now" id="now" hidden>
    <div class="big"><div class="v" id="n-temp">—</div><div class="l">температура</div></div>
    <div class="m"><div class="v" id="n-hum">—</div><div class="l">вологість</div></div>
    <div class="m"><div class="v" id="n-press">—</div><div class="l">тиск, мм</div></div>
    <div class="m"><div class="v" id="n-wind">—</div><div class="l">вітер, м/с</div></div>
    <div class="m"><div class="v" id="n-rain">—</div><div class="l">опади за сьогодні, мм</div></div>
  </section>
  <div class="raining" id="raining" hidden>🌧️ Зараз іде дощ</div>

  <button class="cta" id="send" disabled>📩 Надіслати мені погоду</button>
  <div class="note" id="note"></div>

  <div class="seg" id="seg">
    <button data-h="24" class="on">24 години</button>
    <button data-h="168">7 діб</button>
  </div>

  <div id="charts"></div>
  <footer id="foot"><span class="ver" id="ver">Версія сторінки 1.3.0 (27.10.2026)</span><br>Дані з метеостанції дачі. Знімок оновлюється приблизно раз на 15 хвилин.</footer>
</main>
<div class="tip" id="tip"></div>

<script>
"use strict";
// Адреса веб-застосунку Apps Script (розгортання → Web app). Це НЕ секрет, але без неї сторінка не працюватиме.
const API_URL = "https://script.google.com/macros/s/AKfycbzxymDp66D5HwsPivSfKU3FBc0a0pQXMEWknC-slrBHMl7hldZNi4Ajw_k9l3aT8aKhVg/exec";

// Версія сторінки (показується внизу; допомагає зрозуміти, чи завантажилась нова версія після оновлення на GitHub).
const PAGE_VERSION = "1.3.0 (27.10.2026)";
const verEl = document.getElementById("ver"); if (verEl) verEl.textContent = "Версія сторінки " + PAGE_VERSION;

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const $ = (id) => document.getElementById(id);
// Номери стовпців у рядку історії (у тому ж порядку, що заголовки аркуша «snapshots» у таблиці).
const COL = { ts: 0, temp: 1, hum: 2, press: 3, wind: 4, gust: 5, rain_1h: 6, rain_day: 7, raining: 8, night_min: 9, volt: 10, st_ok: 11 };
let hours = 24;
let data = null;
let showName = true;

function fmt(n, d = 1) { return (n === null || n === undefined || !isFinite(n)) ? "—" : Number(n).toFixed(d); }
function hhmm(ts) { return new Date(ts * 1000).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Kyiv" }); }
function dayLabel(ts) { return new Date(ts * 1000).toLocaleDateString("uk-UA", { weekday: "short", day: "numeric", timeZone: "Europe/Kyiv" }); }
function agoText(sec) {
  const m = Math.round(sec / 60);
  if (m < 1) return "щойно";
  if (m < 60) return m + " хв тому";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " год" + (r ? " " + r + " хв" : "") + " тому";
}
function setNote(text, cls) { const n = $("note"); n.textContent = text || ""; n.className = "note" + (cls ? " " + cls : ""); }

// ===== ЗАВАНТАЖЕННЯ ДАНИХ =====
// api(): запит до Apps Script (GET ?action=history&hours=…) або POST для кнопки; повертає розібрану JSON-відповідь.
async function api(path, opts) {
  const r = await fetch(API_URL + path, opts);
  return r.json();
}

// load(): завантажує історію за обраний період (hours) і викликає render(); при помилці показує повідомлення.
async function load() {
  if (!API_URL || API_URL.indexOf("PASTE_") === 0) {
    $("updated").textContent = "Сторінка ще не налаштована: не вказано адресу сервісу.";
    $("updated").className = "sub stale";
    return;
  }
  try {
    const j = await api("?action=history&hours=" + hours);
    if (!j.ok) throw new Error(j.error || "api");
    data = j;
    showName = j.show_name !== false;
    render();
  } catch (e) {
    $("updated").textContent = "Не вдалося завантажити дані. Спробуйте пізніше.";
    $("updated").className = "sub stale";
  }
  updateButton();
}

// ===== ВИВЕДЕННЯ =====
// render(): 1) блок «зараз» зверху (з останнього знімка); 2) ГРАФІКИ в порядку:
//   Температура → Опади → Тиск → Вітер → Напруга мережі (останнім, лише якщо є дані напруги).
function render() {
  const rows = data.rows || [];
  const latest = data.latest;
  if (!latest) {
    $("updated").textContent = "Даних ще немає.";
    $("now").hidden = true;
    $("charts").innerHTML = '<div class="empty">Графіки з\'являться, коли плата надішле перші знімки.</div>';
    return;
  }
  const age = data.now - latest[COL.ts];
  const stale = age > 45 * 60;
  $("updated").textContent = "Оновлено о " + hhmm(latest[COL.ts]) + " · " + agoText(age) + (stale ? " · дані можуть бути застарілими" : "");
  $("updated").className = "sub" + (stale ? " stale" : "");
  $("now").hidden = false;
  $("n-temp").textContent = fmt(latest[COL.temp]) + "°";
  $("n-hum").textContent = latest[COL.hum] === null ? "—" : Math.round(latest[COL.hum]) + " %";
  $("n-press").textContent = fmt(latest[COL.press], 0);
  $("n-wind").textContent = fmt(latest[COL.wind]) + (latest[COL.gust] !== null ? " (" + fmt(latest[COL.gust]) + ")" : "");
  $("n-rain").textContent = fmt(latest[COL.rain_day]);
  $("raining").hidden = !latest[COL.raining];

  const box = $("charts");
  box.innerHTML = "";
  box.appendChild(card("Температура, °C", lineChart(rows, [{ i: COL.temp, color: "var(--c-temp)", name: "Температура", unit: "°C" }], { dec: 1 })));
  const rain = rainBuckets(rows, hours <= 24 ? 3600 : 6 * 3600);
  const total = rain.reduce((s, b) => s + b.v, 0);
  box.appendChild(card("Опади, мм", barChart(rain, hours <= 24 ? "за годину" : "за 6 год"), "усього " + fmt(total) + " мм"));
  box.appendChild(card("Тиск, мм рт. ст.", lineChart(rows, [{ i: COL.press, color: "var(--c-press)", name: "Тиск", unit: "мм" }], { dec: 0 })));
  box.appendChild(card("Вітер, м/с", lineChart(rows, [
    { i: COL.gust, color: "var(--c-gust)", name: "Пориви", unit: "м/с" },
    { i: COL.wind, color: "var(--c-wind)", name: "Вітер", unit: "м/с" }], { dec: 1, min0: true })));
  // Напруга мережі — останнім; графік з'являється, лише якщо сервіс віддає напругу (PUBLIC_VOLT=1)
  if (rows.some((r) => r[COL.volt] !== null)) {
    box.appendChild(card("Напруга, В", lineChart(rows, [{ i: COL.volt, color: "var(--ok)", name: "Напруга", unit: "В" }],
      { dec: 0, zones: { low: 207, high: 253, near: 12 } }), "🟡 <207 · 🟢 норма · 🔴 >253"));
  }
}

// card(title, el, small): картка з заголовком; small — дрібний підпис праворуч від заголовка.
function card(title, el, small) {
  const c = document.createElement("div");
  c.className = "card";
  const h = document.createElement("h2");
  h.textContent = title;
  if (small) { const s = document.createElement("small"); s.textContent = small; h.appendChild(s); }
  c.appendChild(h);
  c.appendChild(el);
  return c;
}

// ===== ДАНІ ДЛЯ ГРАФІКІВ =====
// ---- опади за інтервалами з приростів добового лічильника (скидання лічильника — приріст = нове значення)
function rainBuckets(rows, step) {
  const out = new Map();
  let prev = null;
  for (const r of rows) {
    const ts = r[COL.ts], cur = r[COL.rain_day];
    if (cur === null) { prev = null; continue; }
    if (prev !== null) {
      const inc = cur >= prev ? cur - prev : cur;
      if (inc > 0 && inc < 100) {
        const k = Math.floor(ts / step) * step;
        out.set(k, (out.get(k) || 0) + inc);
      }
    }
    prev = cur;
  }
  const res = [];
  if (!rows.length) return res;
  const first = Math.floor(rows[0][COL.ts] / step) * step, last = Math.floor(rows[rows.length - 1][COL.ts] / step) * step;
  for (let k = first; k <= last; k += step) res.push({ t: k, v: out.get(k) || 0 });
  return res;
}

// ===== МАЛЮВАННЯ ГРАФІКІВ (SVG) =====
// ---- графіки на SVG
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// niceTicks(lo, hi, n): «гарні» значення для горизонтальних ліній і підписів осі Y.
function niceTicks(lo, hi, n) {
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(+v.toFixed(6));
  return t;
}
const W = 520, H = 190, PL = 34, PR = 10, PT = 8, PB = 22;

// timeAxis(): вертикальні лінії та підписи часу (24 год — кожні 6 год; 7 діб — по днях).
function timeAxis(svg, t0, t1, x) {
  const g = el("g", { class: "axis" }, svg);
  const span = t1 - t0;
  const stepH = hours <= 24 ? 6 : 24;
  const start = Math.ceil(t0 / (stepH * 3600)) * stepH * 3600;
  for (let t = start; t <= t1; t += stepH * 3600) {
    const xx = x(t);
    el("line", { x1: xx, x2: xx, y1: PT, y2: H - PB, stroke: "var(--grid)", "stroke-width": 1 }, g);
    const anchor = xx > W - PR - 18 ? "end" : xx < PL + 14 ? "start" : "middle";   // крайні підписи не обрізаються
    const tx = el("text", { x: xx, y: H - 6, "text-anchor": anchor }, g);
    tx.textContent = hours <= 24 ? hhmm(t) : dayLabel(t);
  }
  void span;
}

// lineChart(rows, series, o): лінійний графік. series — список ліній {i: стовпець, color, name, unit};
// o.dec — знаків після коми, o.min0 — починати вісь з нуля, o.zones {low, high, near} — розфарбувати лінію за зонами (напруга). Пропуск у даних дає розрив лінії.
function lineChart(rows, series, o) {
  const wrap = document.createElement("div");
  const pts = rows.filter((r) => series.some((s) => r[s.i] !== null));
  if (pts.length < 2) { wrap.className = "empty"; wrap.textContent = "Недостатньо даних"; return wrap; }
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H, class: "chart" });
  const t0 = rows[0][COL.ts], t1 = rows[rows.length - 1][COL.ts];
  let lo = Infinity, hi = -Infinity;
  for (const r of pts) for (const s of series) { const v = r[s.i]; if (v !== null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  if (o.min0) lo = Math.min(lo, 0);
  // Зони (напруга): межі норми включаємо в діапазон осі, якщо дані підходять до них ближче ніж на o.zones.near
  if (o.zones) {
    if (lo - o.zones.low < o.zones.near) lo = Math.min(lo, o.zones.low - 2);
    if (o.zones.high - hi < o.zones.near) hi = Math.max(hi, o.zones.high + 2);
  }
  const ticks = niceTicks(lo, hi, 4);
  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const x = (t) => PL + (t - t0) / Math.max(1, t1 - t0) * (W - PL - PR);
  const y = (v) => PT + (1 - (v - lo) / Math.max(1e-9, hi - lo)) * (H - PT - PB);
  timeAxis(svg, t0, t1, x);
  const ga = el("g", { class: "axis" }, svg);
  for (const v of ticks) {
    el("line", { x1: PL, x2: W - PR, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, ga);
    const tx = el("text", { x: PL - 5, y: y(v) + 3, "text-anchor": "end" }, ga);
    tx.textContent = (+v.toFixed(o.dec)).toString();
  }
  const GAP = (hours <= 24 ? 40 : 50) * 60;   // пропуск у даних — розрив лінії, а не «домальована» пряма
  // Межі зон (напруга): пунктир на рівнях «нижче норми» і «вище норми», якщо вони потрапляють у видиму частину осі
  if (o.zones) {
    for (const lv of [o.zones.low, o.zones.high]) {
      if (lv > lo && lv < hi) el("line", { x1: PL, x2: W - PR, y1: y(lv), y2: y(lv), stroke: "var(--hint)", "stroke-width": 1, "stroke-dasharray": "4 4", opacity: .7 }, svg);
    }
  }
  if (o.zones) {
    drawZoneLine(svg, rows, series[0].i, x, y, GAP, o.zones);
    attachTip(svg, rows, series, x, y, o);
    wrap.appendChild(svg);
    return wrap;
  }
  for (const s of series) {
    let d = "", prevT = null;
    for (const r of rows) {
      const v = r[s.i];
      if (v === null) { prevT = null; continue; }
      const cmd = (prevT === null || r[COL.ts] - prevT > GAP) ? "M" : "L";
      d += cmd + x(r[COL.ts]).toFixed(1) + " " + y(v).toFixed(1);
      prevT = r[COL.ts];
    }
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }
  attachTip(svg, rows, series, x, y, o);
  wrap.appendChild(svg);
  return wrap;
}

// ===== РІЗНОКОЛЬОРОВА ЛІНІЯ ПО ЗОНАХ (графік «Напруга мережі») =====
// zoneColor(v, z): колір значення — нижче норми (жовтий 🟡), норма (зелений 🟢), вище норми (червоний 🔴).
function zoneColor(v, z) { return v < z.low ? "var(--c-volt)" : v > z.high ? "var(--bad)" : "var(--ok)"; }
// drawZoneLine(): малює лінію окремими відрізками; там, де значення перетинає межу зони, відрізок ділиться в точці
// перетину, щоб колір змінювався рівно на межі. Пропуск у даних (більше GAP) — розрив лінії.
function drawZoneLine(svg, rows, col, x, y, GAP, z) {
  let prev = null;
  const seg = (t1, v1, t2, v2) => {
    // точки перетину відрізка з межами зон
    const cuts = [0, 1];
    for (const lv of [z.low, z.high]) {
      if ((v1 - lv) * (v2 - lv) < 0) cuts.push((lv - v1) / (v2 - v1));
    }
    cuts.sort((a, b) => a - b);
    for (let k = 0; k < cuts.length - 1; k++) {
      const a = cuts[k], b = cuts[k + 1];
      if (b - a < 1e-6) continue;
      const ta = t1 + (t2 - t1) * a, tb = t1 + (t2 - t1) * b;
      const va = v1 + (v2 - v1) * a, vb = v1 + (v2 - v1) * b;
      el("line", { x1: x(ta), y1: y(va), x2: x(tb), y2: y(vb), stroke: zoneColor((va + vb) / 2, z),
        "stroke-width": 2.4, "stroke-linecap": "round" }, svg);
    }
  };
  for (const r of rows) {
    const v = r[col], t = r[COL.ts];
    if (v === null) { prev = null; continue; }
    if (prev && t - prev.t <= GAP) seg(prev.t, prev.v, t, v);
    prev = { t, v };
  }
}

// barChart(buckets, unitLabel): стовпчики (використовується для опадів).
function barChart(buckets, unitLabel) {
  const wrap = document.createElement("div");
  if (!buckets.length) { wrap.className = "empty"; wrap.textContent = "Недостатньо даних"; return wrap; }
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H, class: "chart" });
  const t0 = buckets[0].t, t1 = buckets[buckets.length - 1].t + (hours <= 24 ? 3600 : 6 * 3600);
  const mx = Math.max(0.5, ...buckets.map((b) => b.v));
  const ticks = niceTicks(0, mx, 4);
  const hi = ticks[ticks.length - 1];
  const x = (t) => PL + (t - t0) / Math.max(1, t1 - t0) * (W - PL - PR);
  const y = (v) => PT + (1 - v / hi) * (H - PT - PB);
  timeAxis(svg, t0, t1, x);
  const ga = el("g", { class: "axis" }, svg);
  for (const v of ticks) {
    el("line", { x1: PL, x2: W - PR, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, ga);
    const tx = el("text", { x: PL - 5, y: y(v) + 3, "text-anchor": "end" }, ga);
    tx.textContent = (+v.toFixed(1)).toString();
  }
  const bw = Math.max(1.5, (W - PL - PR) / buckets.length - 1.5);
  for (const b of buckets) {
    if (b.v <= 0) continue;
    const r = el("rect", { x: x(b.t) + 0.75, y: y(b.v), width: bw, height: Math.max(1, y(0) - y(b.v)), rx: 1.5, fill: "var(--c-rain)" }, svg);
    r.dataset.t = b.t; r.dataset.v = b.v;
    r.addEventListener("pointerdown", () => showTip(r.getBoundingClientRect().left + bw / 2, r.getBoundingClientRect().top - 6,
      hhmm(b.t) + " · " + fmt(b.v, 2) + " мм " + unitLabel));
  }
  wrap.appendChild(svg);
  return wrap;
}

// ---- підказка при дотику/наведенні
let tipTimer = null;
// showTip(): коротка підказка зі значенням при дотику до графіка.
function showTip(px, py, text) {
  const t = $("tip");
  t.textContent = text;
  t.style.left = Math.max(8, Math.min(window.innerWidth - t.offsetWidth - 8, px - t.offsetWidth / 2)) + "px";
  t.style.top = Math.max(8, py - 24) + "px";
  t.style.opacity = 1;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => { t.style.opacity = 0; }, 2500);
}
// attachTip(): вішає на графік обробники дотику/миші — показує значення останньої лінії графіка в точці дотику.
function attachTip(svg, rows, series, x, y, o) {
  const pick = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * W;
    let best = null, bd = Infinity;
    for (const r of rows) {
      if (r[series[series.length - 1].i] === null) continue;
      const d = Math.abs(x(r[COL.ts]) - px);
      if (d < bd) { bd = d; best = r; }
    }
    if (!best) return;
    const s = series[series.length - 1];
    showTip(rect.left + x(best[COL.ts]) / W * rect.width, rect.top + y(best[s.i]) / H * rect.height,
      (hours <= 24 ? "" : dayLabel(best[COL.ts]) + " ") + hhmm(best[COL.ts]) + " · " + fmt(best[s.i], o.dec) + " " + s.unit);
  };
  svg.addEventListener("pointerdown", pick);
  svg.addEventListener("pointermove", (e) => { if (e.pressure > 0 || e.pointerType === "mouse") pick(e); });
}

// ---- кнопка «Надіслати мені погоду»
// ===== КНОПКА «Надіслати мені погоду» =====
// updateButton(): вмикає/вимикає кнопку (працює лише коли сторінку відкрито з Telegram) і показує підказку під нею.
function updateButton() {
  const b = $("send");
  const inTg = !!(tg && tg.initData);
  const ready = API_URL && API_URL.indexOf("PASTE_") !== 0;
  b.disabled = !(inTg && ready);
  if (!inTg) setNote("Щоб отримати погоду в чат, відкрийте цю сторінку з Telegram. Якщо ви вже в Telegram, а кнопка недоступна — Telegram не передав дані користувача (діагностика: initData порожній).", "");
  else if (!$("note").textContent) setNote(showName
    ? "Адміністратор каналу побачить ваше ім'я та нік у Telegram, коли ви надсилаєте запит."
    : "Адміністратор каналу побачить, що хтось надіслав запит (без імені).", "");
}

// sendRequest(retry): надсилає запит у Apps Script (action=send) з підписаними даними Telegram (initData);
// сервіс надсилає погоду особисто в чат. retry — повтор після того, як користувач дозволив боту писати.
async function sendRequest(retry) {
  const b = $("send");
  b.disabled = true;
  setNote("Надсилаю…", "");
  try {
    const j = await api("", { method: "POST", body: JSON.stringify({ action: "send", initData: tg.initData }) });
    if (j.ok) {
      setNote("✅ Готово: погоду надіслано вам у чат з ботом." + (j.stale ? " Дані можуть бути застарілими." : ""), "ok");
      b.textContent = "✅ Надіслано";
      setTimeout(() => { b.textContent = "📩 Надіслати мені погоду"; b.disabled = false; }, 8000);
      return;
    }
    if (j.error === "no_write_access" && !retry && tg.requestWriteAccess) {
      tg.requestWriteAccess((allowed) => {
        if (allowed) sendRequest(true);
        else { setNote("Без дозволу бот не може написати вам у чат. Дозвольте, будь ласка, повідомлення від бота.", "err"); b.disabled = false; }
      });
      return;
    }
    const msg = {
      rate: "Занадто часто: повторіть через " + Math.ceil((j.wait || 600) / 60) + " хв.",
      no_data: "Даних ще немає. Спробуйте трохи пізніше.",
      auth: "Не вдалося підтвердити, що це ви. Закрийте і відкрийте застосунок знову.",
      no_write_access: "Бот не може написати вам у чат: дозвольте повідомлення від бота або натисніть «Start» у чаті з ботом.",
      telegram: "Telegram тимчасово не прийняв повідомлення. Спробуйте пізніше."
    }[j.error] || "Не вдалося надіслати. Спробуйте пізніше.";
    setNote(msg, "err");
  } catch (e) {
    setNote("Немає зв'язку з сервісом. Спробуйте пізніше.", "err");
  }
  b.disabled = false;
}

$("send").addEventListener("click", () => sendRequest(false));
$("seg").addEventListener("click", (e) => {
  const h = e.target && e.target.dataset && e.target.dataset.h;
  if (!h) return;
  hours = Number(h);
  for (const b of $("seg").children) b.classList.toggle("on", b === e.target);
  load();
});
load();
</script>
