<html lang="uk">
<!--

  ВЕРСІЯ СТОРІНКИ: 1.9.2 (30.10.2026) — показується внизу сторінки («Версія сторінки …»)

    1.5.0  Лічильник відкриттів: при запуску сторінка надсилає в сервіс «відкрито» (без видимих змін для людини); власник раз на тиждень отримує зведення.
    1.4.0  Тиск розфарбовано як у звітах (🟡 <755, 🟢 755–765, 🔴 >765 мм); температура змінює колір на 0 °C (синя — мінус, помаранчева — плюс).
    1.3.1  Опади: дощ, що випав під час пропуску зв'язку, більше не потрапляє в один стовпчик — він показується підписом «з них ≈ X мм за час без зв'язку».
    1.3.0  Графік напруги розфарбовано за зонами: 🟡 нижче 207 В, 🟢 норма 207–253 В, 🔴 вище 253 В; пунктирні межі зон.
    1.2.0  Опади — одразу після температури; графік «Напруга» — останнім і РІЗНОКОЛЬОРОВИЙ (🟡 нижче 207 В, 🟢 норма, 🔴 вище 253 В) (з'являється, лише якщо
           в Apps Script увімкнено PUBLIC_VOLT=1); у підвалі видно версію сторінки.
    1.1.0  (скасовано) знімок раз на хвилину.
    1.0.x  Перший випуск: поточна погода, кнопка «Надіслати мені погоду», графіки 24 год / 7 діб.

  КАРТА СТОРІНКИ (де що шукати нижче в коді):
    HTML      <main> — заголовок, блок «зараз» (#now), кнопка (#send), рядок «‹ Сьогодні › [7 діб]» (#daynav),
              контейнер графіків (#charts), підвал (#foot) з версією.
    СКРИПТ    ЗАВАНТАЖЕННЯ ДАНИХ:  api(), load()            — запит історії в Apps Script
              ВИВЕДЕННЯ:           render()                 — блок «зараз» + ПОРЯДОК ГРАФІКІВ (див. нижче)
                                   card()                   — обгортка «картка з заголовком»
              ДАНІ ДЛЯ ГРАФІКІВ:   rainBuckets()            — опади по годинах із приростів лічильника
              МАЛЮВАННЯ ГРАФІКІВ:  niceTicks(), timeAxis()  — підписи осей
                                   lineChart()              — лінійний графік (температура, тиск, вітер, напруга)
                                   barChart()               — стовпчики (опади)
                                   showTip(), attachTip()   — підказка при дотику
              ЛІЧИЛЬНИК:           countOpen()              — повідомляє сервісу, що сторінку відкрито
              КНОПКА:              updateButton(), sendRequest() — «Надіслати мені погоду»
    ПОРЯДОК ГРАФІКІВ задається у render(): Температура → Опади → Тиск → Вітер → Напруга мережі.
    Щоб змінити порядок — переставте відповідні рядки box.appendChild(card(...)) у render().

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Погода на дачі</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #f1f4f8);
    --text: var(--tg-theme-text-color, #14212e);
    --hint: var(--tg-theme-hint-color, #6b7c8c);
    --label: #44566a;   /* підписи: темніші за hint, щоб добре читались */
    --axis: #3b4b5b;    /* підписи осей графіків */
    --accent: var(--tg-theme-button-color, #2b7fd1);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --warn: #d9822b;
    --ok: #2f9e5a;
    --bad: #d64545;
    --c-temp: #e0632f;
    --c-press: #7a5fd0;
    --c-wind: #2b9bb0;
    --c-gust: #9bb7c4;
    --c-rain: #3b86c9;
    --c-volt: #d4a017;
    --c-frost: #2f7fd8;
    --grid: rgba(120, 140, 160, .25);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: var(--tg-theme-bg-color, #17212b); --card: var(--tg-theme-secondary-bg-color, #1f2c3a); --text: var(--tg-theme-text-color, #e8eef4); --hint: var(--tg-theme-hint-color, #8fa1b3); --label: #b9c7d5; --axis: #c8d4e0; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  .sub { color: var(--label); font-size: 15px; margin: 6px 0 14px; }
  .ver { opacity: .8; }
  .sub.stale { color: var(--warn); }
  [hidden] { display: none !important; }   /* атрибут hidden має вигравати в display: grid/flex */
  .now { background: var(--card); border-radius: 16px; padding: 14px; display: grid; grid-template-columns: auto 1fr 1fr; gap: 14px 10px; }
  .now .big { grid-row: span 2; display: flex; flex-direction: column; justify-content: center; margin-right: 12px; }   /* відступ праворуч від температури */
  .now .big .v { font-size: clamp(38px, 12vw, 54px); white-space: nowrap; font-weight: 700; line-height: 1; }
  .now .big .l { color: var(--label); font-size: 15px; margin-top: 4px; }
  .m .v { font-size: clamp(21px, 6.4vw, 28px); font-weight: 700; line-height: 1.1; white-space: nowrap; }
  .m .v .g { font-size: clamp(13px, 3.8vw, 16px); font-weight: 600; color: var(--label); }   /* пориви вітру у дужках — дрібніше */
  .m .l { color: var(--label); font-size: 14px; }
  .raining { margin-top: 8px; font-weight: 600; color: var(--c-rain); }
  button.cta { width: 100%; margin: 14px 0 6px; padding: 14px 16px; border: 0; border-radius: 14px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button.cta:disabled { opacity: .55; cursor: default; }
  .note { color: var(--label); font-size: 14px; min-height: 18px; }
  .note.ok { color: var(--ok); } .note.err { color: var(--bad); }
  /* один рядок: ‹  Сьогодні, дата  ›  ····  [7 діб] */
  .daynav { display: flex; align-items: center; gap: 6px; margin: 18px 0 10px; }
  .daynav .arr { border: 0; background: var(--card); color: var(--text); width: 38px; height: 38px; flex: none; border-radius: 10px; font-size: 22px; line-height: 1; cursor: pointer; }
  .daynav .arr:disabled { opacity: .3; cursor: default; }
  .daynav #dlabel { font-size: 15px; font-weight: 600; white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }
  .daynav #wk { margin-left: auto; flex: none; border: 0; background: var(--card); color: var(--text); padding: 0 14px; height: 38px; border-radius: 10px; font-size: 15px; cursor: pointer; }
  .daynav #wk.on { background: var(--accent); color: var(--accent-text); }
  /* блок «Відключення світла»: дві смуги по 24 години (сьогодні, завтра) */
  .olegend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; margin: 2px 0 4px; }
  .olegend span { display: inline-flex; align-items: center; gap: 6px; }
  .olegend i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
  .ostrip { display: flex; height: 34px; border-radius: 6px; overflow: hidden; position: relative; margin: 6px 0 0; }
  .oc { flex: 1 1 0; border-right: 1px solid var(--card); }
  .oc.on, .olegend i.on { background: var(--ok); }
  .oc.off, .olegend i.off { background: var(--bad); }
  .oc.may, .olegend i.may { background: var(--warn); }
  .oc.h1 { background: linear-gradient(90deg, var(--bad) 50%, var(--ok) 50%); }
  .oc.h2 { background: linear-gradient(90deg, var(--ok) 50%, var(--bad) 50%); }
  .oc.mh1 { background: linear-gradient(90deg, var(--warn) 50%, var(--ok) 50%); }
  .oc.mh2 { background: linear-gradient(90deg, var(--ok) 50%, var(--warn) 50%); }
  .onow { position: absolute; top: -2px; bottom: -2px; width: 3px; margin-left: -1px; background: var(--text); box-shadow: 0 0 0 1px var(--card); }
  .ohours { position: relative; height: 18px; font-size: 12px; color: var(--axis); }
  .ohours span { position: absolute; transform: translateX(-50%); }
  .ohours span:first-child { transform: none; } .ohours span:last-child { transform: translateX(-100%); }
  .oday { font-weight: 600; font-size: 15px; margin-top: 12px; }
  .onf { font-weight: 700; font-size: 14px; }
  .otext { font-size: 14px; margin: 4px 0 2px; }
  .ofoot { font-size: 12.5px; color: var(--label); margin: 10px 0 0; line-height: 1.4; }
  /* блок «Оголошення» — лише для власника */
  #ann summary { cursor: pointer; font-weight: 600; font-size: 15px; padding: 4px 0 8px; }
  .annform { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-bottom: 8px; }
  .annform label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--label); }
  .annform label.wide { grid-column: 1 / -1; }
  .annform input { font: inherit; font-size: 16px; padding: 9px 10px; border: 1px solid var(--grid); border-radius: 10px; background: var(--bg); color: var(--text); min-width: 0; }
  .annform button { grid-column: 1 / -1; border: 0; border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; cursor: pointer; background: var(--card); color: var(--text); outline: 1px solid var(--grid); }
  .annform button.pub { background: var(--accent); color: var(--accent-text); outline: 0; }
  .annform button:disabled { opacity: .55; cursor: default; }
  .annform .note { grid-column: 1 / -1; }
  .card { background: var(--card); border-radius: 16px; padding: 12px 12px 8px; margin-bottom: 12px; }
  .card h2 { font-size: 15px; margin: 0 0 2px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--label); font-weight: 500; font-size: 13px; }
  .sw { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin: 0 5px 2px 0; vertical-align: middle; }   /* зразок кольору лінії в підписі картки */
  svg.chart { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .axis text { fill: var(--axis); font-size: 15px; font-weight: 500; }   /* розмір у одиницях viewBox (520 завширшки): на телефоні ≈ 10–11 px */
  .empty { color: var(--hint); text-align: center; padding: 22px 0; font-size: 14px; }
  footer { color: var(--label); font-size: 13px; margin-top: 16px; }
  .tip { position: fixed; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 4px 8px; border-radius: 8px; opacity: 0; transition: opacity .1s; z-index: 5; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <div class="sub" id="updated">Завантаження…</div>

  <section class="now" id="now" hidden>
    <div class="big"><div class="v" id="n-temp">—</div><div class="l">температура</div></div>
    <div class="m"><div class="v" id="n-hum">—</div><div class="l">вологість</div></div>

    <div class="m"><div class="v" id="n-rain">—</div><div class="l">опади за сьогодні, мм</div></div>

  </div>

  <div id="charts"></div>

  <div id="outbox"></div>

  <details class="card" id="ann" hidden>
    <summary>📢 Оголошення про планові роботи ДТЕК</summary>
    <div class="annform">
      <label class="wide">Дата<input type="date" id="a-date"></label>
      <label>З<input type="time" id="a-from"></label>

  <footer id="foot"><span class="ver" id="ver">Версія сторінки 1.9.2 (30.10.2026)</span><br>Дані з метеостанції дачі. Знімок оновлюється приблизно раз на 15 хвилин.</footer>
</main>
<div class="tip" id="tip"></div>

<script>
"use strict";
// Адреса веб-застосунку Apps Script (розгортання → Web app). Це НЕ секрет, але без неї сторінка не працюватиме.
const API_URL = "https://script.google.com/macros/s/AKfycbzxymDp66D5HwsPivSfKU3FBc0a0pQXMEWknC-slrBHMl7hldZNi4Ajw_k9l3aT8aKhVg/exec";

// Версія сторінки (показується внизу; допомагає зрозуміти, чи завантажилась нова версія після оновлення на GitHub).
const PAGE_VERSION = "1.9.2 (30.10.2026)";
const verEl = document.getElementById("ver"); if (verEl) verEl.textContent = "Версія сторінки " + PAGE_VERSION;

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }

const $ = (id) => document.getElementById(id);
// Номери стовпців у рядку історії (у тому ж порядку, що заголовки аркуша «snapshots» у таблиці).
const COL = { ts: 0, temp: 1, hum: 2, press: 3, wind: 4, gust: 5, rain_1h: 6, rain_day: 7, raining: 8, night_min: 9, volt: 10, st_ok: 11 };
let hours = 24;          // 24 = режим «Сьогодні» (доба за київським часом, з листанням по днях), 168 = «7 діб»
let dayOff = 0;          // 0 = сьогодні, 1 = вчора, … до DAY_MAX днів назад (історія сервісу — 7 діб)
const DAY_MAX = 6;
let win = null;          // вікно графіків {t0, t1} у режимі «Сьогодні»: від 00:00 до 24:00 обраного дня; у режимі «7 діб» — null
let locked = false;      // сервіс не пустив (не підписник каналу / відкрито не з Telegram): дані й кнопка вимкнені
let loadSeq = 0;         // номер запиту: відповідь на старіший запит (швидке листання) відкидається
let data = null;
let showName = true;

function fmt(n, d = 1) { return (n === null || n === undefined || !isFinite(n)) ? "—" : Number(n).toFixed(d); }
function hhmm(ts) { return new Date(ts * 1000).toLocaleTimeString("uk-UA", { hour: "2-digit", minute: "2-digit", timeZone: "Europe/Kyiv" }); }
function dayLabel(ts) { return new Date(ts * 1000).toLocaleDateString("uk-UA", { weekday: "short", day: "numeric", timeZone: "Europe/Kyiv" }); }
// ---- доба за київським часом (незалежно від поясу телефона)
function kyivParts(ts) {
  const o = {};
  for (const p of new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(new Date(ts * 1000))) o[p.type] = +p.value;
  o.hour = o.hour % 24;
  return o;
}
function kyivOffset(ts) { const o = kyivParts(ts); return Date.UTC(o.year, o.month - 1, o.day, o.hour, o.minute, o.second) / 1000 - ts; }
function kyivMidnight(y, m, d) {   // момент 00:00 за Києвом (враховує перехід на зимовий/літній час)
  const g = Date.UTC(y, m - 1, d) / 1000;
  return g - kyivOffset(g - kyivOffset(g));
}
// dayBounds(off): {t0, t1, date} — початок і кінець доби «off днів тому»; date — календарна дата (UTC-об'єкт для підпису).
function dayBounds(off) {
  const n = kyivParts(Math.floor(Date.now() / 1000));
  const a = new Date(Date.UTC(n.year, n.month - 1, n.day - off)), b = new Date(Date.UTC(n.year, n.month - 1, n.day - off + 1));
  return { t0: kyivMidnight(a.getUTCFullYear(), a.getUTCMonth() + 1, a.getUTCDate()), t1: kyivMidnight(b.getUTCFullYear(), b.getUTCMonth() + 1, b.getUTCDate()), date: a };
}
// updateNav(): підписує день і вмикає/вимикає стрілки; у режимі «7 діб» стрілки неактивні, кнопка «7 діб» підсвічена.
function updateNav() {
  const week = hours > 24;
  $("wk").classList.toggle("on", week);
  $("wk").setAttribute("aria-pressed", week ? "true" : "false");
  if (week) {
    $("dlabel").textContent = "Останні 7 діб";
    $("dprev").disabled = true;
    $("dnext").disabled = true;
    return;
  }
  const d = dayBounds(dayOff).date;
  const txt = d.toLocaleDateString("uk-UA", { weekday: "short", day: "2-digit", month: "2-digit", timeZone: "UTC" });
  $("dlabel").textContent = dayOff === 0 ? "Сьогодні, " + txt : dayOff === 1 ? "Вчора, " + txt : txt;
  $("dprev").disabled = dayOff >= DAY_MAX;
  $("dnext").disabled = dayOff <= 0;
}
function agoText(sec) {
  const m = Math.round(sec / 60);
  if (m < 1) return "щойно";
  if (m < 60) return m + " хв тому";
  const h = Math.floor(m / 60), r = m % 60;
  return h + " год" + (r ? " " + r + " хв" : "") + " тому";
}
function setNote(text, cls) { const n = $("note"); n.textContent = text || ""; n.className = "note" + (cls ? " " + cls : ""); }

// ===== ЗАВАНТАЖЕННЯ ДАНИХ =====
// api(): запит до Apps Script (POST: історія для графіків і кнопка, з підписаним initData); повертає розібрану JSON-відповідь.
async function api(path, opts) {
  const r = await fetch(API_URL + path, opts);
  return r.json();
}

// load(): завантажує історію за обраний період (hours) і викликає render(); при помилці показує повідомлення.
async function load() {
  if (!API_URL || API_URL.indexOf("PASTE_") === 0) {
    $("updated").textContent = "Сторінка ще не налаштована: не вказано адресу сервісу.";
    $("updated").className = "sub stale";
    return;
  }
  const my = ++loadSeq;
  let reqH = hours;
  if (hours <= 24) {       // «Сьогодні»: беремо історію від початку обраної доби (+ 1 год запасу для лічильника опадів)
    win = dayBounds(dayOff);
    reqH = Math.min(168, Math.max(2, Math.ceil((Date.now() / 1000 - win.t0) / 3600) + 1));
  } else {
    win = null;
  }
  updateNav();
  try {
    const j = await api("", { method: "POST", body: JSON.stringify({ action: "history", hours: reqH, initData: (tg && tg.initData) || "" }) });
    if (my !== loadSeq) return;     // за цей час натиснули ще раз — ця відповідь уже не потрібна
    if (!j.ok) throw new Error(j.error || "api");
    locked = false;
    $("send").hidden = false; $("daynav").hidden = false;
    $("ann").hidden = !j.owner;          // блок оголошення бачить лише власник (сервіс сам перевіряє це ще раз)
    data = j;
    showName = j.show_name !== false;
    render();
    loadOutages();
  } catch (e) {
    if (my !== loadSeq) return;
    const why = {
      auth: "Відкрийте мініапплікацію з Telegram (за посиланням із каналу або від бота): у браузері дані не показуються.",
      not_member: "Мініапліковація доступна підписникам каналу «МОЯ ДАЧА Інформканал». Підпишіться на канал і відкрийте її знову."
    }[e && e.message];
    if (why) { lockUi(why); return; }     // доступ закрито: лишається тільки пояснення
    // інша помилка: у дужках короткий код (якщо є) — він допоможе зрозуміти причину
    const code = e && /^[a-z_]{2,20}$/.test(e.message || "") ? " (код: " + e.message + ")" : "";
    $("updated").textContent = "Не вдалося завантажити дані. Спробуйте пізніше." + code;
    $("updated").className = "sub stale";
  }

}

// lockUi(text): доступ закрито (не підписник каналу / відкрито не з Telegram) — ховаємо дані, кнопку, стрілки; лишається лише пояснення.

// ===== ГРАФІК ВІДКЛЮЧЕНЬ ДТЕК (блок під графіками) =====
// Сервіс раз на 15 хв читає офіційну сторінку ДТЕК і віддає для черги (за замовчуванням 6.1): days — затверджені відключення
// (дата → 24 години: yes/no/first/second), possible — типовий тижневий графік (yes/maybe/mfirst/msecond). Година N = (N-1):00–N:00.
// Нічого не вигадуємо: немає затвердженого графіка — так і пишемо; немає даних ДТЕК — пишемо «недоступні».
let outLoaded = false;
async function loadOutages() {
  if (outLoaded) return;
  try {
    const j = await api("", { method: "POST", body: JSON.stringify({ action: "outages", initData: (tg && tg.initData) || "" }) });
    if (!j.ok && j.error !== "unavailable") return;     // доступ закрито тощо — блок просто не показуємо
    outLoaded = !!j.ok;
    renderOutages(j);
  } catch (e) { /* блок лишається порожнім; спробуємо при наступному оновленні */ }
}
const OFF_KIND = { no: [0, 60], first: [0, 30], second: [30, 60] }, MAY_KIND = { maybe: [0, 60], mfirst: [0, 30], msecond: [30, 60] };
// outIntervals(codes, kinds): 24 коди → «10:00–14:30, 18:00–19:00» (злиті відрізки) або "".
function outIntervals(codes, kinds) {
  const seg = [];
  codes.forEach((c, i) => {
    const k = kinds[c]; if (!k) return;
    const a = i * 60 + k[0], b = i * 60 + k[1];
    if (seg.length && seg[seg.length - 1][1] === a) seg[seg.length - 1][1] = b; else seg.push([a, b]);
  });
  const t = (m) => String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
  return seg.map(([a, b]) => t(a) + "–" + t(b)).join(", ");
}
function outStrip(codes, isToday) {
  const st = document.createElement("div");
  st.className = "ostrip";
  codes.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "oc " + ({ yes: "on", no: "off", first: "h1", second: "h2", maybe: "may", mfirst: "mh1", msecond: "mh2" }[c] || "on");
    d.title = String(i).padStart(2, "0") + ":00–" + String(i + 1).padStart(2, "0") + ":00";
    st.appendChild(d);
  });
  if (isToday) {       // тонка риска «зараз» (за київським часом)
    const n = kyivParts(Math.floor(Date.now() / 1000)), m = document.createElement("div");
    m.className = "onow"; m.style.left = ((n.hour * 60 + n.minute) / 1440 * 100).toFixed(2) + "%";
    st.appendChild(m);
  }
  return st;
}
function renderOutages(j) {
  const box = $("outbox");
  box.innerHTML = "";
  const wrap = document.createElement("div");
  if (!j.ok) {
    wrap.className = "empty";
    wrap.textContent = "Дані ДТЕК зараз недоступні. Спробуйте пізніше.";
    box.appendChild(card("Відключення світла", wrap));
    return;
  }
  const lg = document.createElement("div"); lg.className = "olegend";
  lg.innerHTML = '<span><i class="on"></i>світло є</span><span><i class="off"></i>відключення</span><span><i class="may"></i>можливі</span>';
  wrap.appendChild(lg);
  const n = kyivParts(Math.floor(Date.now() / 1000));
  const pad = (x) => String(x).padStart(2, "0");
  const dates = [0, 1].map((off) => { const d = new Date(Date.UTC(n.year, n.month - 1, n.day + off)); return { iso: d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()), label: (off ? "Завтра" : "Сьогодні") + ", " + pad(d.getUTCDate()) + "." + pad(d.getUTCMonth() + 1), today: !off }; });
  let anyPossible = false;
  dates.forEach((d) => {
    const fact = (j.days || {})[d.iso], poss = (j.possible || {})[d.iso];
    const title = document.createElement("div"); title.className = "oday"; title.textContent = d.label;
    if (!fact) { const nf = document.createElement("b"); nf.className = "onf"; nf.textContent = " · Графік НЕ застосовується"; title.appendChild(nf); }
    wrap.appendChild(title);
    const codes = fact || poss;
    if (codes) { wrap.appendChild(outStrip(codes, d.today)); const h = document.createElement("div"); h.className = "ohours"; for (let x = 0; x <= 24; x += 3) { const sp = document.createElement("span"); sp.textContent = pad(x); sp.style.left = (x / 24 * 100) + "%"; h.appendChild(sp); } wrap.appendChild(h); }
    const tx = document.createElement("div"); tx.className = "otext";
    if (fact) {
      const iv = outIntervals(fact, OFF_KIND);
      tx.textContent = iv ? "🔴 Відключення: " + iv : "🟢 Відключень немає";
    } else {
      anyPossible = anyPossible || !!poss;
      const pv = poss ? outIntervals(poss, MAY_KIND) : "";
      tx.textContent = pv ? "🟠 можливі: " + pv : "";
    }
    wrap.appendChild(tx);
  });
  const foot = document.createElement("div"); foot.className = "ofoot";
  foot.textContent = (anyPossible ? "Затверджений графік ДТЕК з'являється, коли заплановано відключення. Поки його немає, помаранчевим показано типовий тижневий графік — це лише можливі відключення, не гарантія. " : "") + "Черга " + (j.group || "") + " · Джерело: dtek-oem.com.ua" + (j.updated ? " · оновлено ДТЕК " + j.updated : "") +
    (j.fetched ? " · перевірено " + agoText(Math.floor(Date.now() / 1000) - j.fetched) : "") + (j.stale ? " · ⚠️ дані застарілі: ДТЕК зараз не відповідає" : "");
  wrap.appendChild(foot);
  box.appendChild(card("Відключення світла, черга " + (j.group || ""), wrap));
}

// ===== ВИВЕДЕННЯ =====
// render(): 1) блок «зараз» зверху (з останнього знімка); 2) ГРАФІКИ в порядку:
//   Температура → Опади → Тиск → Вітер → Напруга мережі (останнім, лише якщо є дані напруги).
function render() {
  const allRows = data.rows || [];
  // у режимі «Сьогодні» лінії малюємо лише в межах обраної доби; для опадів беремо всі рядки (потрібен рядок перед початком доби як відлік лічильника)
  const rows = win ? allRows.filter((r) => r[COL.ts] >= win.t0 && r[COL.ts] < win.t1) : allRows;
  const latest = data.latest;
  if (!latest) {
    $("updated").textContent = "Даних ще немає.";
    $("now").hidden = true;
    $("charts").innerHTML = '<div class="empty">Графіки з\'являться, коли плата надішле перші знімки.</div>';
    return;
  }
  const age = data.now - latest[COL.ts];
  const stale = age > 45 * 60;
  $("updated").textContent = "Оновлено о " + hhmm(latest[COL.ts]) + " · " + agoText(age) + (stale ? " · дані можуть бути застарілими" : "");
  $("updated").className = "sub" + (stale ? " stale" : "");
  $("now").hidden = false;
  $("n-temp").textContent = fmt(latest[COL.temp]) + "°";
  $("n-hum").textContent = latest[COL.hum] === null ? "—" : Math.round(latest[COL.hum]) + " %";
  $("n-press").textContent = fmt(latest[COL.press], 0);
  $("n-wind").innerHTML = fmt(latest[COL.wind]) + (latest[COL.gust] !== null ? ' <span class="g">(' + fmt(latest[COL.gust]) + ")</span>" : "");   // числа, не користувацький текст
  $("n-rain").textContent = fmt(latest[COL.rain_day]);
  $("raining").hidden = !latest[COL.raining];

  const box = $("charts");
  box.innerHTML = "";
  box.appendChild(card("Температура, °C", lineChart(rows, [{ i: COL.temp, color: "var(--c-temp)", name: "Температура", unit: "°C" }],
    // лінія змінює колір на 0 °C: синя — мінус, помаранчева — плюс (high=1e9: верхньої межі немає)
    { dec: 1, zones: { low: 0, high: 1e9, near: 3, colors: { low: "var(--c-frost)", ok: "var(--c-temp)", high: "var(--c-temp)" } } }), "🔵 мінус · 🟠 плюс"));
  const rain = rainBuckets(allRows, hours <= 24 ? 3600 : 6 * 3600);
  const total = rain.reduce((s, b) => s + b.v, 0);
  box.appendChild(card("Опади, мм", barChart(rain, hours <= 24 ? "за годину" : "за 6 год"), "усього " + fmt(total + (rain.gapMm || 0)) + " мм" + (rain.gapMm > 0.05 ? " · з них ≈ " + fmt(rain.gapMm) + " мм за час без зв'язку (без стовпчиків)" : "")));
  box.appendChild(card("Тиск, мм рт. ст.", lineChart(rows, [{ i: COL.press, color: "var(--c-press)", name: "Тиск", unit: "мм" }],
    // ті самі межі, що й у звітах: нижче 755 — 🟡, 755–765 — 🟢, вище 765 — 🔴
    { dec: 1, zones: { low: 755, high: 765, near: 3 } }), "🟡 <755 · 🟢 норма · 🔴 >765"));
  box.appendChild(card("Вітер, м/с", lineChart(rows, [
    { i: COL.gust, color: "var(--c-gust)", name: "Пориви", unit: "м/с" },
    { i: COL.wind, color: "var(--c-wind)", name: "Вітер", unit: "м/с" }], { dec: 1, min0: true }),
    legend([["var(--c-gust)", "пориви"], ["var(--c-wind)", "вітер"]])));
  // Напруга мережі — останнім; графік з'являється, лише якщо сервіс віддає напругу (PUBLIC_VOLT=1)
  if (rows.some((r) => r[COL.volt] !== null)) {
    box.appendChild(card("Напруга, В", lineChart(rows, [{ i: COL.volt, color: "var(--ok)", name: "Напруга", unit: "В" }],
      { dec: 0, zones: { low: 207, high: 253, near: 12 } }), "🟡 <207 · 🟢 норма · 🔴 >253"));
  }
}

// legend(items): підпис «■ пориви · ■ вітер» із зразками кольорів ліній ([[колір, назва], …]); кольори — ті самі змінні, що й у лініях графіка.
function legend(items) {
  const f = document.createDocumentFragment();
  items.forEach(([color, name], i) => {
    if (i) f.appendChild(document.createTextNode(" · "));
    const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = color;
    f.appendChild(sw);
    f.appendChild(document.createTextNode(name));
  });
  return f;
}

// card(title, el, small): картка з заголовком; small — дрібний підпис праворуч від заголовка.
function card(title, el, small) {
  const c = document.createElement("div");
  c.className = "card";
  const h = document.createElement("h2");
  h.textContent = title;
  if (small) { const s = document.createElement("small"); if (typeof small === "string") s.textContent = small; else s.appendChild(small); h.appendChild(s); }
  c.appendChild(h);
  c.appendChild(el);
  return c;
}

// ===== ДАНІ ДЛЯ ГРАФІКІВ =====
// ---- опади за інтервалами з приростів добового лічильника (скидання лічильника — приріст = нове значення)
// Якщо між двома знімками був пропуск (зв'язок пропав), приріст за цей час НЕ відносимо до одного стовпчика:
// невідомо, коли саме йшов дощ. Його сума збирається окремо в res.gapMm і показується підписом під заголовком.
function rainBuckets(rows, step) {
  const dayKey = (t) => Math.floor((t + kyivOffset(t)) / 86400);   // номер доби за київським часом
  const out = new Map();
  const GAPS = (hours <= 24 ? 40 : 50) * 60;     // той самий поріг розриву, що й для ліній
  let prev = null, prevTs = null, gapMm = 0;
  for (const r of rows) {
    const ts = r[COL.ts], cur = r[COL.rain_day];
    if (cur === null) { prev = null; prevTs = null; continue; }
    if (win && ts >= win.t1) break;                                  // «Сьогодні»: знімки після кінця доби не рахуємо
    if (win && ts < win.t0) { prev = cur; prevTs = ts; continue; }   // до початку доби — лише відлік для лічильника
    if (prev !== null) {
      // Лічильник «опади за сьогодні» обнуляється опівночі. Нова календарна доба (за Києвом) — рахуємо все значення, а не різницю
      // з учорашнім: вчора 2 мм, сьогодні перший знімок 3 мм — це 3 мм (а не 1). Спадання значення — теж скидання.
      const newDay = dayKey(ts) !== dayKey(prevTs);
      const inc = (newDay || cur < prev) ? cur : cur - prev;
      if (inc > 0 && inc < 100) {
        if (ts - prevTs > GAPS) {
          gapMm += inc;                          // пропуск у даних
        } else {
          const k = Math.floor(ts / step) * step;
          out.set(k, (out.get(k) || 0) + inc);
        }
      }
    }
    prev = cur; prevTs = ts;
  }
  const res = [];
  res.gapMm = gapMm;
  if (!rows.length) return res;
  // «Сьогодні»: стовпчики на всю добу (00:00–24:00), навіть якщо доба ще не закінчилась; «7 діб»: від першого до останнього знімка
  const first = win ? Math.floor(win.t0 / step) * step : Math.floor(rows[0][COL.ts] / step) * step;
  const last = win ? Math.floor((win.t1 - 1) / step) * step : Math.floor(rows[rows.length - 1][COL.ts] / step) * step;
  for (let k = first; k <= last; k += step) res.push({ t: k, v: out.get(k) || 0 });
  return res;
}

// ===== МАЛЮВАННЯ ГРАФІКІВ (SVG) =====
// ---- графіки на SVG
const NS = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// niceTicks(lo, hi, n): «гарні» значення для горизонтальних ліній і підписів осі Y.
function niceTicks(lo, hi, n) {
  if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p, step = (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, t = [];
  for (let v = a; v <= b + step / 2; v += step) t.push(+v.toFixed(6));
  return t;
}
const W = 520, H = 205, PL = 44, PR = 12, PT = 10, PB = 30;

// timeAxis(): вертикальні лінії та підписи часу (24 год — кожні 6 год; 7 діб — по днях).
function timeAxis(svg, t0, t1, x) {
  const g = el("g", { class: "axis" }, svg);
  const span = t1 - t0;
  const stepH = hours <= 24 ? 6 : 24;
  const start = win ? t0 : Math.ceil(t0 / (stepH * 3600)) * stepH * 3600;   // «Сьогодні»: підписи від 00:00 доби (00, 06, 12, 18, 24)
  for (let t = start; t <= t1 + 60; t += stepH * 3600) {
    const xx = x(t);
    el("line", { x1: xx, x2: xx, y1: PT, y2: H - PB, stroke: "var(--grid)", "stroke-width": 1 }, g);
    const anchor = xx > W - PR - 18 ? "end" : xx < PL + 14 ? "start" : "middle";   // крайні підписи не обрізаються
    const tx = el("text", { x: xx, y: H - 8, "text-anchor": anchor }, g);
    tx.textContent = hours <= 24 ? (win && t >= win.t1 - 60 ? "24:00" : hhmm(t)) : dayLabel(t);
  }
  void span;
}

// lineChart(rows, series, o): лінійний графік. series — список ліній {i: стовпець, color, name, unit};
// o.dec — знаків після коми, o.min0 — починати вісь з нуля, o.zones {low, high, near, colors?} — розфарбувати лінію за зонами (температура, тиск, напруга). Пропуск у даних дає розрив лінії.
function lineChart(rows, series, o) {
  const wrap = document.createElement("div");
  const pts = rows.filter((r) => series.some((s) => r[s.i] !== null));
  if (pts.length < 2) { wrap.className = "empty"; wrap.textContent = "Недостатньо даних"; return wrap; }
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H, class: "chart" });
  const t0 = win ? win.t0 : rows[0][COL.ts], t1 = win ? win.t1 : rows[rows.length - 1][COL.ts];
  let lo = Infinity, hi = -Infinity;
  for (const r of pts) for (const s of series) { const v = r[s.i]; if (v !== null) { lo = Math.min(lo, v); hi = Math.max(hi, v); } }
  if (o.min0) lo = Math.min(lo, 0);
  // Зони (напруга): межі норми включаємо в діапазон осі, якщо дані підходять до них ближче ніж на o.zones.near
  if (o.zones) {
    if (lo - o.zones.low < o.zones.near) lo = Math.min(lo, o.zones.low - 2);
    if (o.zones.high - hi < o.zones.near) hi = Math.max(hi, o.zones.high + 2);
  }
  const ticks = niceTicks(lo, hi, 4);
  lo = ticks[0]; hi = ticks[ticks.length - 1];
  const x = (t) => PL + (t - t0) / Math.max(1, t1 - t0) * (W - PL - PR);
  const y = (v) => PT + (1 - (v - lo) / Math.max(1e-9, hi - lo)) * (H - PT - PB);
  timeAxis(svg, t0, t1, x);
  const ga = el("g", { class: "axis" }, svg);
  for (const v of ticks) {
    el("line", { x1: PL, x2: W - PR, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, ga);
    const tx = el("text", { x: PL - 6, y: y(v) + 5, "text-anchor": "end" }, ga);
    tx.textContent = (+v.toFixed(o.dec)).toString();
  }
  const GAP = (hours <= 24 ? 40 : 50) * 60;   // пропуск у даних — розрив лінії, а не «домальована» пряма
  // Межі зон (напруга): пунктир на рівнях «нижче норми» і «вище норми», якщо вони потрапляють у видиму частину осі
  if (o.zones) {
    for (const lv of [o.zones.low, o.zones.high]) {
      if (lv > lo && lv < hi) el("line", { x1: PL, x2: W - PR, y1: y(lv), y2: y(lv), stroke: "var(--hint)", "stroke-width": 1, "stroke-dasharray": "4 4", opacity: .7 }, svg);
    }
  }
  if (o.zones) {
    drawZoneLine(svg, rows, series[0].i, x, y, GAP, o.zones);
    attachTip(svg, rows, series, x, y, o);
    wrap.appendChild(svg);
    return wrap;
  }
  for (const s of series) {
    let d = "", prevT = null;
    for (const r of rows) {
      const v = r[s.i];
      if (v === null) { prevT = null; continue; }
      const cmd = (prevT === null || r[COL.ts] - prevT > GAP) ? "M" : "L";
      d += cmd + x(r[COL.ts]).toFixed(1) + " " + y(v).toFixed(1);
      prevT = r[COL.ts];
    }
    el("path", { d, fill: "none", stroke: s.color, "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
  }
  attachTip(svg, rows, series, x, y, o);
  wrap.appendChild(svg);
  return wrap;
}

// ===== РІЗНОКОЛЬОРОВА ЛІНІЯ ПО ЗОНАХ (графіки «Температура», «Тиск», «Напруга») =====
// zoneColor(v, z): колір значення за зонами z {low, high, colors?}: нижче low / між / вище high.
// Типові кольори — 🟡 нижче норми, 🟢 норма, 🔴 вище норми; для температури задано свої (синій мінус, помаранчевий плюс).
function zoneColor(v, z) {
  const c = z.colors || { low: "var(--c-volt)", ok: "var(--ok)", high: "var(--bad)" };   // типово: 🟡 нижче, 🟢 норма, 🔴 вище
  return v < z.low ? c.low : v > z.high ? c.high : c.ok;
}
// drawZoneLine(): малює лінію окремими відрізками; там, де значення перетинає межу зони, відрізок ділиться в точці
// перетину, щоб колір змінювався рівно на межі. Пропуск у даних (більше GAP) — розрив лінії.
function drawZoneLine(svg, rows, col, x, y, GAP, z) {
  let prev = null;
  const seg = (t1, v1, t2, v2) => {
    // точки перетину відрізка з межами зон
    const cuts = [0, 1];
    for (const lv of [z.low, z.high]) {
      if ((v1 - lv) * (v2 - lv) < 0) cuts.push((lv - v1) / (v2 - v1));
    }
    cuts.sort((a, b) => a - b);
    for (let k = 0; k < cuts.length - 1; k++) {
      const a = cuts[k], b = cuts[k + 1];
      if (b - a < 1e-6) continue;
      const ta = t1 + (t2 - t1) * a, tb = t1 + (t2 - t1) * b;
      const va = v1 + (v2 - v1) * a, vb = v1 + (v2 - v1) * b;
      el("line", { x1: x(ta), y1: y(va), x2: x(tb), y2: y(vb), stroke: zoneColor((va + vb) / 2, z),
        "stroke-width": 2.4, "stroke-linecap": "round" }, svg);
    }
  };
  for (const r of rows) {
    const v = r[col], t = r[COL.ts];
    if (v === null) { prev = null; continue; }
    if (prev && t - prev.t <= GAP) seg(prev.t, prev.v, t, v);
    prev = { t, v };
  }
}

// barChart(buckets, unitLabel): стовпчики (використовується для опадів).
function barChart(buckets, unitLabel) {
  const wrap = document.createElement("div");
  if (!buckets.length) { wrap.className = "empty"; wrap.textContent = "Недостатньо даних"; return wrap; }
  const svg = el("svg", { viewBox: "0 0 " + W + " " + H, class: "chart" });
  const step = hours <= 24 ? 3600 : 6 * 3600;
  const t0 = win ? win.t0 : buckets[0].t, t1 = win ? win.t1 : buckets[buckets.length - 1].t + step;
  const mx = Math.max(0.5, ...buckets.map((b) => b.v));
  const ticks = niceTicks(0, mx, 4);
  const hi = ticks[ticks.length - 1];
  const x = (t) => PL + (t - t0) / Math.max(1, t1 - t0) * (W - PL - PR);
  const y = (v) => PT + (1 - v / hi) * (H - PT - PB);
  timeAxis(svg, t0, t1, x);
  const ga = el("g", { class: "axis" }, svg);
  for (const v of ticks) {
    el("line", { x1: PL, x2: W - PR, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }, ga);
    const tx = el("text", { x: PL - 6, y: y(v) + 5, "text-anchor": "end" }, ga);
    tx.textContent = (+v.toFixed(1)).toString();
  }
  const bw = Math.max(1.5, (W - PL - PR) / Math.max(1, (t1 - t0) / step) - 1.5);
  for (const b of buckets) {
    if (b.v <= 0) continue;
    const r = el("rect", { x: x(b.t) + 0.75, y: y(b.v), width: bw, height: Math.max(1, y(0) - y(b.v)), rx: 1.5, fill: "var(--c-rain)" }, svg);
    r.dataset.t = b.t; r.dataset.v = b.v;
    r.addEventListener("pointerdown", () => showTip(r.getBoundingClientRect().left + bw / 2, r.getBoundingClientRect().top - 6,
      hhmm(b.t) + " · " + fmt(b.v, 2) + " мм " + unitLabel));
  }
  wrap.appendChild(svg);
  return wrap;
}

// ---- підказка при дотику/наведенні
let tipTimer = null;
// showTip(): коротка підказка зі значенням при дотику до графіка.
function showTip(px, py, text) {
  const t = $("tip");
  t.textContent = text;
  t.style.left = Math.max(8, Math.min(window.innerWidth - t.offsetWidth - 8, px - t.offsetWidth / 2)) + "px";
  t.style.top = Math.max(8, py - 24) + "px";
  t.style.opacity = 1;
  clearTimeout(tipTimer);
  tipTimer = setTimeout(() => { t.style.opacity = 0; }, 2500);
}
// attachTip(): вішає на графік обробники дотику/миші — показує значення останньої лінії графіка в точці дотику.
function attachTip(svg, rows, series, x, y, o) {
  const pick = (ev) => {
    const rect = svg.getBoundingClientRect();
    const px = (ev.clientX - rect.left) / rect.width * W;
    let best = null, bd = Infinity;
    for (const r of rows) {
      if (r[series[series.length - 1].i] === null) continue;
      const d = Math.abs(x(r[COL.ts]) - px);
      if (d < bd) { bd = d; best = r; }
    }
    if (!best) return;
    const s = series[series.length - 1];
    showTip(rect.left + x(best[COL.ts]) / W * rect.width, rect.top + y(best[s.i]) / H * rect.height,
      (hours <= 24 ? "" : dayLabel(best[COL.ts]) + " ") + hhmm(best[COL.ts]) + " · " + fmt(best[s.i], o.dec) + " " + s.unit);
  };
  svg.addEventListener("pointerdown", pick);
  svg.addEventListener("pointermove", (e) => { if (e.pressure > 0 || e.pointerType === "mouse") pick(e); });
}

// ===== ЛІЧИЛЬНИК ВІДКРИТТІВ =====
// countOpen(): один раз при запуску сторінки повідомляє сервісу, що її відкрили (action="hit"). Для людей із Telegram
// додається підписаний initData — сервіс рахує різних людей за скороченим відбитком, імена не зберігаються.
// Помилки ігноруються: лічильник ніколи не заважає роботі сторінки.
function countOpen() {
  if (!API_URL || API_URL.indexOf("PASTE_") === 0) return;
  try {
    fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, keepalive: true,
      body: JSON.stringify({ action: "hit", app: "weather", initData: (tg && tg.initData) || "" }) }).catch(() => {});
  } catch (e) { /* ігноруємо */ }
}

// ===== КНОПКА «Надіслати мені погоду» =====
// updateButton(): вмикає/вимикає кнопку (працює лише коли сторінку відкрито з Telegram) і показує підказку під нею.
function updateButton() {
  const b = $("send");
  const inTg = !!(tg && tg.initData);
  const ready = API_URL && API_URL.indexOf("PASTE_") !== 0;
  b.disabled = !(inTg && ready) || locked;
  if (!inTg) setNote("Щоб отримати погоду в чат, відкрийте цю сторінку з Telegram. Якщо ви вже в Telegram, а кнопка недоступна — Telegram не передав дані користувача (діагностика: initData порожній).", "");
  else if (!locked && !$("note").textContent) setNote(showName
    ? ""
    : "", "");
}

// sendRequest(retry): надсилає запит у Apps Script (action=send) з підписаними даними Telegram (initData);
// сервіс надсилає погоду особисто в чат. retry — повтор після того, як користувач дозволив боту писати.
async function sendRequest(retry) {
  const b = $("send");
  b.disabled = true;
  setNote("Надсилаю…", "");
  try {
    const j = await api("", { method: "POST", body: JSON.stringify({ action: "send", initData: tg.initData }) });
    if (j.ok) {
      setNote("✅ Готово: погоду надіслано вам у чат з ботом." + (j.stale ? " Дані можуть бути застарілими." : ""), "ok");
      b.textContent = "✅ Надіслано";
      setTimeout(() => { b.textContent = "📩 Надіслати мені погоду"; b.disabled = false; }, 8000);
      return;
    }
    if (j.error === "no_write_access" && !retry && tg.requestWriteAccess) {
      tg.requestWriteAccess((allowed) => {
        if (allowed) sendRequest(true);
        else { setNote("Без дозволу бот не може написати вам у чат. Дозвольте, будь ласка, повідомлення від бота.", "err"); b.disabled = false; }
      });
      return;
    }
    if (j.error === "not_member") { lockUi("Погода доступна підписникам каналу «МОЯ ДАЧА Інформканал»"); return; }
    const msg = {
      rate: "Занадто часто: повторіть через " + Math.ceil((j.wait || 600) / 60) + " хв.",
      no_data: "Даних ще немає. Спробуйте трохи пізніше.",
      auth: "Не вдалося підтвердити, що це ви. Закрийте і відкрийте застосунок знову.",
      not_member: "Погода доступна підписникам каналу «МОЯ ДАЧА Інформканал»",
      no_write_access: "Бот не може написати",
      telegram: "Telegram тимчасово не прийняв повідомлення. Спробуйте пізніше."
    }[j.error] || "Не вдалося надіслати. Спробуйте пізніше.";
    setNote(msg, "err");
  } catch (e) {
    setNote("Немає зв'язку з сервісом. Спробуйте пізніше.", "err");
  }
  b.disabled = false;
}

$("send").addEventListener("click", () => sendRequest(false));
// кнопка «7 діб»: перемикач (натиснули — 7 діб, ще раз — повернулись до «Сьогодні»)
$("wk").addEventListener("click", () => {
  hours = hours > 24 ? 24 : 168;
  dayOff = 0;
  load();
});
// стрілки ‹ › у режимі «Сьогодні»: на день назад / вперед
$("dprev").addEventListener("click", () => { if (dayOff < DAY_MAX) { dayOff++; load(); } });
$("dnext").addEventListener("click", () => { if (dayOff > 0) { dayOff--; load(); } });

// ===== ОГОЛОШЕННЯ (лише власник) =====
// Дата й час вибираються вікном телефона (input type=date/time). «Перегляд» надсилає текст вам у чат, «Опублікувати» — у канал.
// Текст оголошення (шаблон) зберігається на сервісі: Code.gs, CFG.ANNOUNCE_TEMPLATE.
(function () {
  const dateEl = $("a-date"), fromEl = $("a-from"), toEl = $("a-to"), noteEl = $("a-note");
  const n = kyivParts(Math.floor(Date.now() / 1000));
  dateEl.min = n.year + "-" + String(n.month).padStart(2, "0") + "-" + String(n.day).padStart(2, "0");   // не раніше сьогодні
  function say(text, cls) { noteEl.textContent = text || ""; noteEl.className = "note" + (cls ? " " + cls : ""); }
  function ask(text) {
    return new Promise((resolve) => {
      try {
        if (tg && tg.showConfirm && tg.isVersionAtLeast && tg.isVersionAtLeast("6.2")) { tg.showConfirm(text, (ok) => resolve(!!ok)); return; }
      } catch (e) { /* нижче — звичайне вікно */ }
      resolve(window.confirm(text));
    });
  }
  async function go(mode) {
    if (!dateEl.value || !fromEl.value || !toEl.value) { say("Виберіть дату й час: з і до.", "err"); return; }
    if (toEl.value <= fromEl.value) { say("Час «до» має бути пізнішим за час «з».", "err"); return; }
    const when = dateEl.value.split("-").reverse().join(".") + ", з " + fromEl.value + " до " + toEl.value;
    if (mode === "publish" && !(await ask("Опублікувати в каналі оголошення: " + when + "?\nЙого побачать усі підписники."))) return;
    $("a-prev").disabled = $("a-pub").disabled = true;
    say("Надсилаю…", "");
    try {
      const j = await api("", { method: "POST", body: JSON.stringify({ action: "announce", mode, date: dateEl.value, from: fromEl.value, to: toEl.value, initData: (tg && tg.initData) || "" }) });
      if (j.ok) say(j.dup ? "Це оголошення вже опубліковано щойно." : mode === "publish" ? "✅ Опубліковано в каналі." : "✅ Надіслано вам у чат з ботом.", "ok");
      else say({
        not_owner: "Ця дія доступна лише власнику.", auth: "Не вдалося підтвердити, що це ви. Закрийте і відкрийте застосунок знову.",
        bad_date: "Некоректна дата.", bad_time: "Некоректний час (з має бути раніше за до).",
        no_channel: "У сервісі не задано канал (властивість CHANNEL_ID).",
        telegram: "Telegram не прийняв повідомлення" + (j.detail ? ": " + j.detail : ".")
      }[j.error] || "Не вдалося надіслати. Спробуйте пізніше.", "err");
    } catch (e) { say("Немає зв'язку з сервісом. Спробуйте пізніше.", "err"); }
    $("a-prev").disabled = $("a-pub").disabled = false;
  }
  $("a-prev").addEventListener("click", () => go("preview"));
  $("a-pub").addEventListener("click", () => go("publish"));
})();
countOpen();
load();
</script>
